[project]
name = "llm-sakura"
version = "0.1a0"
description = "LLM plugin for models hosted by Sakura Internet's Sakura AI Engine (さくらのAI Engine)"
readme = "README.md"
authors = [{name = "kiwamizamurai"}]
license = "Apache-2.0"
classifiers = []
requires-python = ">=3.11"
dependencies = [
    "llm>=0.38",
    "httpx2",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[project.urls]
Homepage = "https://github.com/kiwamizamurai/llm-sakura"
Changelog = "https://github.com/kiwamizamurai/llm-sakura/releases"
Issues = "https://github.com/kiwamizamurai/llm-sakura/issues"
CI = "https://github.com/kiwamizamurai/llm-sakura/actions"

[project.entry-points.llm]
sakura = "llm_sakura"

[dependency-groups]
dev = ["pytest", "pytest-recording", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
